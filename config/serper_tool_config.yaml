tools:
  - class_name: verl.tools.serper_search_tool.SerperSearchTool
    config:
      type: native
      # Optional web search backend. Keep this value empty in committed configs;
      # pass a key through your deployment secret manager before running.
      serper_api_key: ""
      search_top_k: 3
      search_region: "us"
      search_lang: "en"
      max_retries: 3
      request_timeout: 30.0
    tool_schema:
      type: function
      function:
        name: web_search
        description: Searches the web for relevant information based on the given query.
        parameters:
          type: object
          properties:
            query:
              type: array
              items:
                type: string
              description: A list of search queries. The tool will return search results for each query.
          required:
            - query
